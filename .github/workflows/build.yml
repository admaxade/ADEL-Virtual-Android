name: Build VineOS Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            vineos-engine/VineOS-0.1.0-alpha/**/*.gradle*
            vineos-engine/VineOS-0.1.0-alpha/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        working-directory: vineos-engine/VineOS-0.1.0-alpha
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: vineos-engine/VineOS-0.1.0-alpha
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK_FILE=$(find vineos-engine/VineOS-0.1.0-alpha/app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)
          test -n "$APK_FILE"
          test -s "$APK_FILE"
          ls -lh "$APK_FILE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: vineos-engine/VineOS-0.1.0-alpha/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
