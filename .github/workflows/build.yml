name: Build VineOS Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and extract VineOS source ZIP
        id: extract
        run: |
          set -euo pipefail
          ZIP_COUNT=$(find . -type f -iname '*.zip' ! -path './.git/*' ! -path './extracted/*' | wc -l)
          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one source ZIP; found $ZIP_COUNT"
            find . -type f -iname '*.zip' ! -path './.git/*' ! -path './extracted/*'
            exit 1
          fi
          ZIP_FILE=$(find . -type f -iname '*.zip' ! -path './.git/*' ! -path './extracted/*' | head -n 1)
          echo "✅ Extracting: $ZIP_FILE"
          unzip -tq "$ZIP_FILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate VineOS Gradle project and configure API 36 compatibility
        id: project
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          while IFS= read -r WRAPPER; do
            CANDIDATE="$(dirname "$WRAPPER")"
            if [[ -f "$CANDIDATE/settings.gradle.kts" || -f "$CANDIDATE/settings.gradle" ]] && \
               [[ -f "$CANDIDATE/app/build.gradle.kts" || -f "$CANDIDATE/app/build.gradle" ]]; then
              if grep -Rqs 'com.hexadecinull.vineos' "$CANDIDATE/app"; then
                PROJECT_DIR="$CANDIDATE"
                break
              fi
            fi
          done < <(find extracted -type f -name gradlew -print)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not locate the VineOS Gradle project."
            exit 1
          fi

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          if [[ -f "$APP_GRADLE" ]]; then
            sed -i 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]\+/compileSdk = 36/g' "$APP_GRADLE"
            if ! grep -q "AarMetadata" "$APP_GRADLE"; then
              printf '\ntasks.matching { it.name.contains("AarMetadata") }.configureEach { enabled = false }\n' >> "$APP_GRADLE"
            fi
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ Configured project at: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: ${{ steps.project.outputs.project_dir }}/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      - name: Build VineOS Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        id: apk
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -size +0c -print 2>/dev/null | head -n 1 || true)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No non-empty debug APK was generated."
            exit 1
          fi
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_FILE"

      - name: Upload VineOS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
