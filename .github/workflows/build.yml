name: Build VineOS Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and Extract VineOS ZIP
        id: extract
        run: |
          set -euo pipefail

          EXPECTED_ZIP="ADEL_Virtual_Android_PHASE1_GITHUB_READY.zip"

          mapfile -t MATCHES < <(
            find . -type f -name "$EXPECTED_ZIP" \
              ! -path './.git/*' \
              ! -path './extracted/*'
          )

          if [ "${#MATCHES[@]}" -eq 0 ]; then
            echo "::error::Project ZIP not found!"
            find . -type f -iname '*.zip'
            exit 1
          fi

          if [ "${#MATCHES[@]}" -gt 1 ]; then
            echo "::error::Multiple project ZIP files found!"
            printf '%s\n' "${MATCHES[@]}"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${MATCHES[0]}" -d extracted

          echo "ZIP extracted successfully."

      - name: Locate VineOS Gradle Project
        id: locate
        run: |
          set -euo pipefail

          mapfile -t WRAPPERS < <(
            find extracted -type f -name gradlew
          )

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::gradlew not found!"
            exit 1
          fi

          PROJECT_DIR=""

          for WRAPPER in "${WRAPPERS[@]}"; do
            CANDIDATE="$(dirname "$WRAPPER")"

            if [ -f "$CANDIDATE/settings.gradle" ] || \
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle project settings not found!"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project found: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate.outputs.project_dir }}/**/*.gradle*
            ${{ steps.locate.outputs.project_dir }}/**/gradle-wrapper.properties

      - name: Configure Android SDK
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found!"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=""

          for CANDIDATE in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"; do

            if [ -x "$CANDIDATE" ]; then
              SDKMANAGER="$CANDIDATE"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -path '*/bin/sdkmanager' \
              2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found!"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK Manager:"
          "$SDKMANAGER" --version

      - name: Detect Android compileSdk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          SDK_VERSION="$(python3 - <<'PY'
          import glob
          import re
          import sys

          files = glob.glob("**/build.gradle", recursive=True)
          files += glob.glob("**/build.gradle.kts", recursive=True)

          patterns = [
              r'compileSdk\s*=\s*(\d+)',
              r'compileSdkVersion\s*\(?\s*(\d+)',
          ]

          for path in files:
              with open(path, encoding="utf-8") as f:
                  content = f.read()

              for pattern in patterns:
                  match = re.search(pattern, content)

                  if match:
                      print(match.group(1))
                      sys.exit(0)

          sys.exit("Could not detect compileSdk in Gradle files.")
          PY
          )"

          echo "Detected Android API: $SDK_VERSION"

          echo "ANDROID_API=$SDK_VERSION" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK Components
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-$ANDROID_API" \
            "build-tools;35.0.0"

      - name: Build VineOS Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK Output
        id: apk
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          mapfile -t APKS < <(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -size +0c -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Debug APK was not generated!"
            exit 1
          fi

          APK_FILE="${APKS[0]}"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

          echo "APK generated successfully:"
          ls -lh "$APK_FILE"

      - name: Upload VineOS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
