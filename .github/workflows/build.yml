name: Build ADEL Virtual Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find and Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname "ADEL_Virtual_Android_GitHub_Actions_CLEAN.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found!"
            echo "Available ZIP files:"
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager --licenses
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android Project
        id: project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found!"
            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find "${{ steps.project.outputs.project_dir }}" -type f -name "*.apk"
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADEL-Virtual-Android-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
