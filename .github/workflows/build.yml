name: Build ADEL Virtual Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for project ZIP..."

          ZIP_FILE=$(find . -type f -iname 'ADEL_Virtual_Android*.zip' \
            ! -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            echo "Available ZIP files:"
            find . -type f -iname '*.zip'
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            CANDIDATE="$(dirname "$FILE")"

            if [ -f "$CANDIDATE/gradlew" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r FILE; do
              CANDIDATE="$(dirname "$FILE")"

              if [ -f "$CANDIDATE/gradlew" ]; then
                PROJECT_DIR="$CANDIDATE"
                break
              fi
            done < <(
              find extracted -type f -name 'gradlew'
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Extracted files:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Android project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADEL-Virtual-Android-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
