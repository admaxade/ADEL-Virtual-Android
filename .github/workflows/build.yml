name: Build VineOS Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and extract VineOS source ZIP
        id: extract
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find . -type f -iname '*.zip' ! -path './.git/*' ! -path './extracted/*' -print)
          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one source ZIP; found ${#ZIP_FILES[@]}"
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi
          unzip -tq "${ZIP_FILES[0]}"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${ZIP_FILES[0]}" -d extracted

      - name: Locate VineOS Gradle project and enforce API 37
        id: project
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          while IFS= read -r WRAPPER; do
            CANDIDATE="$(dirname "$WRAPPER")"
            if [[ -f "$CANDIDATE/settings.gradle.kts" || -f "$CANDIDATE/settings.gradle" ]] && \
               [[ -f "$CANDIDATE/app/build.gradle.kts" || -f "$CANDIDATE/app/build.gradle" ]]; then
              if grep -Rqs 'com.hexadecinull.vineos' "$CANDIDATE/app"; then
                PROJECT_DIR="$CANDIDATE"
                break
              fi
            fi
          done < <(find extracted -type f -name gradlew -print)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not locate the VineOS Gradle project."
            find extracted -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts -o -name gradlew \) -print
            exit 1
          fi

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          if [[ -f "$APP_GRADLE" ]]; then
            python3 - "$APP_GRADLE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          pattern = r'(?m)^(\s*compileSdk\s*=\s*)\d+(\s*(?://.*)?)$'
          s2, count = re.subn(pattern, r'\g<1>37\g<2>', s, count=1)
          if count == 0:
              raise SystemExit('compileSdk assignment not found in app/build.gradle.kts')
          p.write_text(s2)
          PY
          else
            APP_GRADLE="$PROJECT_DIR/app/build.gradle"
            python3 - "$APP_GRADLE" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          s2, count = re.subn(r'(?m)^(\s*compileSdk\s+)\d+(\s*(?://.*)?)$', r'\g<1>37\g<2>', s, count=1)
          if count == 0:
              raise SystemExit('compileSdk assignment not found in app/build.gradle')
          p.write_text(s2)
          PY
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "VineOS project: $PROJECT_DIR"
          grep -n 'compileSdk' "$PROJECT_DIR/app/build.gradle"* | head -n 5
          grep -Eq 'compileSdk[[:space:]]*(=[[:space:]]*)?37([[:space:]]|$)' "$PROJECT_DIR/app/build.gradle"* || {
            echo "::error::compileSdk was not set to 37"; exit 1;
          }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: ${{ steps.project.outputs.project_dir }}/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      - name: Build VineOS Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK
        id: apk
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          mapfile -t APKS < <(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -size +0c -print 2>/dev/null || true)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No non-empty debug APK was generated."
            exit 1
          fi
          APK_FILE="${APKS[0]}"
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_FILE"

      - name: Upload VineOS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
