name: Build VineOS Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure & locate VineOS
        id: check
        run: |
          set -e
          echo "Repository root: $(pwd)"
          ls -la
          echo "Searching for Gradle wrapper:"
          find . -name gradlew -type f

          GRADLEW_PATH=$(find . -name gradlew -type f | grep -i "vineos" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
          fi

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Gradle wrapper (gradlew) not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found in $PROJECT_DIR"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "✅ Verified VineOS project directory: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.check.outputs.project_dir }}
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.check.outputs.project_dir }}
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.check.outputs.project_dir }}
        run: |
          set -e
          APK_FILE=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)
          test -n "$APK_FILE"
          test -s "$APK_FILE"
          ls -lh "$APK_FILE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: ${{ steps.check.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
