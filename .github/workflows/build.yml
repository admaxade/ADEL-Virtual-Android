name: Build ADEL Virtual Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  # 1. تحميل ملفات المستودع
  - name: Checkout repository
    uses: actions/checkout@v4

  # 2. إعداد Java
  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  # 3. تثبيت الأدوات المطلوبة
  - name: Install unzip
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip

  # 4. البحث عن ملف المشروع وفك ضغطه
  - name: Find and Extract Project ZIP
    shell: bash
    run: |
      set -e

      echo "Searching for ADEL project ZIP..."

      ZIP_FILE=$(find . -type f \
        -iname 'ADEL_Virtual_Android*.zip' \
        ! -path './.git/*' \
        ! -path './extracted/*' \
        | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Project ZIP not found!"
        echo "Available ZIP files:"
        find . -type f -iname '*.zip'
        exit 1
      fi

      echo "Found ZIP: $ZIP_FILE"

      mkdir -p extracted

      unzip -o "$ZIP_FILE" -d extracted

      echo "Project ZIP extracted successfully."

  # 5. تحديد مجلد مشروع Android
  - name: Locate Android Project
    shell: bash
    run: |
      set -e

      echo "Searching for Android Gradle project..."

      PROJECT_DIR=""

      while IFS= read -r FILE; do
        CANDIDATE="$(dirname "$FILE")"

        if [ -f "$CANDIDATE/build.gradle" ] || \
           [ -f "$CANDIDATE/build.gradle.kts" ]; then
          PROJECT_DIR="$CANDIDATE"
          break
        fi

      done < <(
        find extracted -type f \
          -name 'settings.gradle' \
          -o -name 'settings.gradle.kts'
      )

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Android Gradle project not found."

        echo "Extracted files:"
        find extracted -maxdepth 6 -type f | head -200

        exit 1
      fi

      echo "Android project found: $PROJECT_DIR"

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  # 6. إعداد Android SDK
  - name: Set up Android SDK
    uses: android-actions/setup-android@v4

  # 7. تثبيت حزم Android المطلوبة
  - name: Install Android SDK Packages
    shell: bash
    run: |
      set -e

      yes | sdkmanager --licenses || true

      sdkmanager --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  # 8. إعداد Gradle
  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  # 9. بناء التطبيق
  - name: Build Android APK
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      set -e

      echo "Starting Android APK build..."

      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew --no-daemon assembleDebug
      else
        echo "Gradle wrapper not found."
        echo "Using installed Gradle."

        gradle --no-daemon assembleDebug
      fi

  # 10. التحقق من إنشاء APK
  - name: Verify APK
    shell: bash
    run: |
      set -e

      echo "Searching for generated APK..."

      APK_FILE=$(find "$PROJECT_DIR" \
        -type f \
        -name '*.apk' \
        | head -n 1)

      if [ -z "$APK_FILE" ]; then
        echo "ERROR: APK was not generated!"

        echo "Build output:"
        find "$PROJECT_DIR" -type f \
          | grep -E 'build|apk' || true

        exit 1
      fi

      echo "APK generated successfully!"

      ls -lh "$APK_FILE"

  # 11. رفع التطبيق للتنزيل
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ADEL-Virtual-Android-APK
      path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
      if-no-files-found: error
      retention-days: 14
