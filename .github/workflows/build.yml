name: Build VineOS Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate VineOS Project
        id: locate
        run: |
          set -euo pipefail
          if [ -f "ADEL_Virtual_Android_MERGED_ALPHA/vineos-engine/VineOS-0.1.0-alpha/gradlew" ]; then
            PROJECT_DIR="ADEL_Virtual_Android_MERGED_ALPHA/vineos-engine/VineOS-0.1.0-alpha"
          elif [ -f "vineos-engine/VineOS-0.1.0-alpha/gradlew" ]; then
            PROJECT_DIR="vineos-engine/VineOS-0.1.0-alpha"
          else
            echo "::error::VineOS project directory not found! Check repository root structure."
            ls -la
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ Found VineOS project at: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate.outputs.project_dir }}/**/*.gradle*
            ${{ steps.locate.outputs.project_dir }}/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      - name: Build VineOS Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        id: apk
        run: |
          set -euo pipefail
          mapfile -t APKS < <(
            find "${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug" \
              -maxdepth 1 -type f -name '*.apk' -size +0c -print 2>/dev/null
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "apk_path=${APKS[0]}" >> "$GITHUB_OUTPUT"
          ls -lh "${APKS[0]}"

      - name: Upload VineOS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
