name: Build VineOS Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install ZIP tools
      - name: Install ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 3. Find and extract project ZIP
      - name: Find and Extract VineOS ZIP
        id: extract
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -type f -iname '*.zip' \
              ! -path './.git/*' \
              ! -path './extracted/*' \
              -print
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found!"
            find . -maxdepth 5 -type f
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found. Keep only the project ZIP."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "Found ZIP: $ZIP_FILE"

          unzip -tq "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      # 4. Locate Gradle project
      - name: Locate VineOS Gradle Project
        id: locate
        run: |
          set -euo pipefail

          mapfile -t WRAPPERS < <(
            find extracted -type f -name gradlew -print
          )

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::Gradle wrapper not found!"
            find extracted -maxdepth 7 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=""

          for WRAPPER in "${WRAPPERS[@]}"; do
            CANDIDATE="$(dirname "$WRAPPER")"

            if [ -f "$CANDIDATE/settings.gradle" ] || \
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle settings file not found!"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "VineOS project found:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      # 5. Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate.outputs.project_dir }}/**/*.gradle*
            ${{ steps.locate.outputs.project_dir }}/**/gradle-wrapper.properties

      # 6. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7. Accept Android licenses
      - name: Accept Android SDK Licenses
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses

      # 8. Install Android components
      - name: Install Android SDK Components
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      # 9. Build APK
      - name: Build VineOS Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 10. Find APK
      - name: Verify APK
        id: apk
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          mapfile -t APKS < <(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -size +0c \
              -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::APK was not generated!"
            find "$PROJECT_DIR" -type d -path '*/build/outputs/*'
            exit 1
          fi

          APK_FILE="${APKS[0]}"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

          echo "APK successfully generated:"
          ls -lh "$APK_FILE"

      # 11. Upload APK
      - name: Upload VineOS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
