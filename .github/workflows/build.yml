name: Build VineOS Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and Extract VineOS ZIP
        id: extract
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -type f -iname '*.zip' \
              ! -path './.git/*' \
              ! -path './extracted/*' \
              -print
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::No project ZIP found!"
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found. Keep only one."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          echo "Extracting: $ZIP_FILE"

          unzip -tq "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate VineOS Gradle Project
        id: locate
        run: |
          set -euo pipefail

          mapfile -t WRAPPERS < <(
            find extracted -type f -name gradlew -print
          )

          PROJECT_DIR=""

          for WRAPPER in "${WRAPPERS[@]}"; do
            CANDIDATE="$(dirname "$WRAPPER")"

            if [ -f "$CANDIDATE/settings.gradle" ] || \
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::VineOS Gradle project not found!"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ Found project: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate.outputs.project_dir }}/**/*.gradle*
            ${{ steps.locate.outputs.project_dir }}/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''          # لا تثبت شيء هنا لتجنب الفشل

      - name: Normalize & Detect compileSdk
        id: sdk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          GRADLE_FILE="app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::app/build.gradle.kts not found!"
            exit 1
          fi

          # حماية إضافية: تحويل 37 إلى 36 إذا وُجد
          sed -i 's/compileSdk[[:space:]]*=[[:space:]]*37/compileSdk = 36/g' "$GRADLE_FILE"
          sed -i 's/targetSdk[[:space:]]*=[[:space:]]*37/targetSdk = 36/g' "$GRADLE_FILE"

          COMPILE_SDK=$(grep -E 'compileSdk[[:space:]]*=' "$GRADLE_FILE" \
            | head -n 1 \
            | grep -oE '[0-9]+' \
            | head -n 1 || true)

          if [ -z "$COMPILE_SDK" ]; then
            echo "::error::Could not detect compileSdk automatically."
            grep -n 'compileSdk' "$GRADLE_FILE" || true
            exit 1
          fi

          echo "compile_sdk=$COMPILE_SDK" >> "$GITHUB_OUTPUT"
          echo "✅ Using compileSdk: $COMPILE_SDK"

      - name: Accept Android SDK Licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK Components
        run: |
          set -euo pipefail

          COMPILE_SDK="${{ steps.sdk.outputs.compile_sdk }}"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

          echo "✅ Installed: platforms;android-${COMPILE_SDK} + build-tools;36.0.0"

      - name: Build VineOS Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        id: apk
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          mapfile -t APKS < <(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -size +0c \
              -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::APK was not generated!"
            exit 1
          fi

          APK_FILE="${APKS[0]}"
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_FILE"

      - name: Upload VineOS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
