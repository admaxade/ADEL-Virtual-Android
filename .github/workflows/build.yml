name: Build ADEL Virtual Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install unzip
      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. Find and extract project ZIP
      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extraction completed."

      # 5. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install Android SDK packages
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Locate Android project
      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found!"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 9. Build APK
      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle --no-daemon assembleDebug

      # 10. Verify APK
      - name: Verify APK
        id: verify
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK_FILE"

          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADEL-Virtual-Android-APK
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
