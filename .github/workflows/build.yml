name: Build ADEL Virtual Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install unzip
      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. Find and extract project ZIP
      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for project ZIP..."

          ZIP_FILE=$(find . -type f \
            -iname 'ADEL_Virtual_Android*.zip' \
            ! -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            echo "Available ZIP files:"
            find . -type f -iname '*.zip'
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."

      # 5. Locate Android project
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            CANDIDATE="$(dirname "$FILE")"

            if [ -f "$CANDIDATE/build.gradle" ] || \
               [ -f "$CANDIDATE/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install Android SDK packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8. Accept Android licenses
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 9. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 10. Build APK
      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building ADEL Virtual Android..."

          gradle --no-daemon assembleDebug

      # 11. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_FILE"

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADEL-Virtual-Android-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 13. Build summary
      - name: Build Summary
        if: success()
        run: |
          echo "================================"
          echo "ADEL VIRTUAL ANDROID"
          echo "BUILD SUCCESSFUL"
          echo "================================"
