name: Build ADEL Virtual Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Unified Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. تثبيت أداة فك الضغط
      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. البحث عن ملف ZIP في جميع المجلدات وفك ضغطه
      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f \
            -iname 'ADEL_Virtual_Android*.zip' \
            ! -path './.git/*' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            echo "Available ZIP files:"
            find . -type f -iname '*.zip'
            exit 1
          fi

          echo "Found project: $ZIP_FILE"

          mkdir -p extracted
          unzip -o -q "$ZIP_FILE" -d extracted

          echo "Project extracted successfully."

      # 5. تحديد مشروع VineOS الرئيسي
      - name: Locate VineOS Main Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted/ADEL_Virtual_Android_MERGED_ALPHA/vineos-engine/VineOS-0.1.0-alpha"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: VineOS settings.gradle.kts not found!"
            echo "Available Gradle settings:"
            find extracted -name settings.gradle.kts
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: VineOS app/build.gradle.kts not found!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Gradle Wrapper not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "VineOS project verified."

      # 6. إعداد Android SDK وNDK وCMake
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-37
            build-tools;35.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      # 7. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 8. التحقق من بيئة البناء
      - name: Verify Build Environment
        shell: bash
        run: |
          set -e

          echo "Java version:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          ./gradlew --version

      # 9. بناء APK
      - name: Build ADEL Virtual Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 10. التحقق من إنشاء APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found!"
            exit 1
          fi

          APK_FILE=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_FILE"

      # 11. رفع APK إلى GitHub Actions
      - name: Upload ADEL APK
        uses: actions/upload-artifact@v4
        with:
          name: ADEL-Virtual-Android-Alpha
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
