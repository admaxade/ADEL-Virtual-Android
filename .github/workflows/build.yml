name: Build VineOS Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or Extract VineOS Project
        id: locate
        run: |
          set -euo pipefail

          # 1. البحث عن المشروع المفكوك مباشرة في المستودع (مع إعطاء الأولوية لـ VineOS)
          GRADLEW_PATH=$(find . -maxdepth 5 -type f -name gradlew ! -path './.git/*' | grep -i "vineos" | head -n 1 || true)

          if [ -z "$GRADLEW_PATH" ]; then
            GRADLEW_PATH=$(find . -maxdepth 5 -type f -name gradlew ! -path './.git/*' | head -n 1 || true)
          fi

          # 2. إذا لم يكن مفكوكًا، ابحث عن ملف ZIP وفك ضغطه تلقائيًا
          if [ -z "$GRADLEW_PATH" ]; then
            ZIP_FILE=$(find . -type f -iname '*.zip' ! -path './.git/*' | head -n 1 || true)
            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Neither extracted project nor ZIP file found in repository!"
              ls -la
              exit 1
            fi
            echo "✅ Found archive: $ZIP_FILE — Extracting..."
            rm -rf extracted && mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            GRADLEW_PATH=$(find extracted -type f -name gradlew | grep -i "vineos" | head -n 1 || true)
            if [ -z "$GRADLEW_PATH" ]; then
              GRADLEW_PATH=$(find extracted -type f -name gradlew | head -n 1 || true)
            fi
          fi

          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found in $PROJECT_DIR"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ Verified VineOS project at: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate.outputs.project_dir }}/**/*.gradle*
            ${{ steps.locate.outputs.project_dir }}/**/gradle-wrapper.properties

      - name: Configure Android SDK
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found!"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for CANDIDATE in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$CANDIDATE" ]; then
              SDKMANAGER="$CANDIDATE"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -path '*/bin/sdkmanager' \
              2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found!"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Detect Android compileSdk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          SDK_VERSION="$(python3 - <<'PY'
          import glob, re

          files = (
              glob.glob("**/build.gradle", recursive=True)
              + glob.glob("**/build.gradle.kts", recursive=True)
              + glob.glob("**/libs.versions.toml", recursive=True)
          )

          patterns = [
              r'compileSdk\s*=\s*["\']?(\d+)["\']?',
              r'compileSdkVersion\s*\(?\s*["\']?(\d+)["\']?',
          ]

          for path in files:
              with open(path, encoding="utf-8") as f:
                  content = f.read()
              for pattern in patterns:
                  match = re.search(pattern, content)
                  if match:
                      print(match.group(1))
                      raise SystemExit(0)

          print("36")
          PY
          )"

          echo "Detected Android API: $SDK_VERSION"
          echo "ANDROID_API=$SDK_VERSION" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK Components
        run: |
          set -euo pipefail
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-$ANDROID_API" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      - name: Build VineOS Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK Output
        id: apk
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          mapfile -t APKS < <(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -size +0c -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Debug APK was not generated!"
            exit 1
          fi

          APK_FILE="${APKS[0]}"
          echo "apk_path=$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "✅ APK generated successfully:"
          ls -lh "$APK_FILE"

      - name: Upload VineOS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
