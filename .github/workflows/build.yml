name: Build VineOS Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and extract VineOS project ZIP
        id: extract
        run: |
          set -euo pipefail

          mapfile -t MATCHES < <(find . -maxdepth 4 -type f -iname '*.zip' -print)

          if [ "${#MATCHES[@]}" -eq 0 ]; then
            echo "::error::No project ZIP file found in repository!"
            ls -la
            exit 1
          fi

          if [ "${#MATCHES[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found. Keep only one:"
            printf '%s\n' "${MATCHES[@]}"
            exit 1
          fi

          echo "✅ Extracting: ${MATCHES}"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${MATCHES}" -d extracted
          echo "Project ZIP extracted successfully."

      - name: Locate VineOS Gradle project
        id: locate
        run: |
          set -euo pipefail

          mapfile -t WRAPPERS < <(find extracted -type f -name gradlew -print)

          if [ "${#WRAPPERS[@]}" -eq 0 ]; then
            echo "::error::No gradlew found inside the extracted ZIP."
            find extracted -maxdepth 6 -type f | head -n 150
            exit 1
          fi

          PROJECT_DIR=""
          for WRAPPER in "${WRAPPERS[@]}"; do
            CANDIDATE="$(dirname "$WRAPPER")"
            if [ -f "$CANDIDATE/settings.gradle" ] || [ -f "$CANDIDATE/settings.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::gradlew was found, but its project settings file was not found."
            printf '%s\n' "${WRAPPERS[@]}"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ Found VineOS project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate.outputs.project_dir }}/**/*.gradle*
            ${{ steps.locate.outputs.project_dir }}/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      - name: Build VineOS Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        id: apk
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          mapfile -t APKS < <(
            find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -size +0c -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Debug APK was not generated."
            find "$PROJECT_DIR" -type d -path '*/build/outputs/*' -print || true
            exit 1
          fi

          echo "apk_path=${APKS}" >> "$GITHUB_OUTPUT"
          ls -lh "${APKS}"

      - name: Upload VineOS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VineOS-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
