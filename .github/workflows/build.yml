name: Build ADEL Virtual Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. تثبيت أدوات فك الضغط
      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # 4. البحث عن ملف المشروع وفك ضغطه
      - name: Find and Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -type f \
            -iname "ADEL_Virtual_Android_v0.2.0_SOURCE.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found!"
            echo "Available ZIP files:"
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "Found project: $ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully!"

          find extracted -maxdepth 4 -type f

      # 5. إعداد Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 6. تثبيت مكونات Android
      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. تحديد مكان المشروع
      - name: Locate Android Project
        id: project
        run: |
          SETTINGS_FILE=$(find extracted -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            find extracted -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 8. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 9. بناء التطبيق
      - name: Build Android APK
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          gradle --no-daemon clean assembleDebug

      # 10. التأكد من إنشاء APK
      - name: Verify APK
        run: |
          APK="${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find "${{ steps.project.outputs.project_dir }}" -type f -name "*.apk"
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh "$APK"

      # 11. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
